[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_revenue_estimator"]

[project]
name = "restaurant-revenue-estimator"
version = "0.1.0"
description = "Python Web boilerplate with FastAPI + Jinja2 + Alpine.js + Tailwind CSS + SQLite"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
keywords = ["web", "boilerplate", "fastapi", "jinja2"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "numpy>=2.0.0",
    "typer>=0.15.0",
    "structlog>=25.1.0",
]

[project.scripts]
rre = "restaurant_revenue_estimator.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "types-pyyaml>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
    "B008",     # FastAPI Depends() in argument defaults (standard FastAPI pattern)
    "RUF001",   # 日本語の全角括弧・記号を許す
    "RUF003",   # 同上（コメント内）
    "RUF002",   # 同上（docstring 内）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
# 長い日本語の f-string は分割すると読みにくい
"src/restaurant_revenue_estimator/report/markdown.py" = ["E501"]
"src/restaurant_revenue_estimator/inputs/legacy.py" = ["E501"]
# docs/ の調査スクリプトは成果物の再現用。日本語の全角括弧や長い行を許す。
"docs/*" = ["B905", "E501", "E741", "PLR0915", "PTH123", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/restaurant_revenue_estimator"]
branch = false
relative_files = true
omit = [
    "src/restaurant_revenue_estimator/alembic/*",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

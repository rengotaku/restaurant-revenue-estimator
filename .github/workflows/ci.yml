name: restaurant-revenue-estimator CI

on:
  push:
    branches: [main]
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install $(cat .python-version)

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install Node.js dependencies
        run: npm install

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --cov=src/restaurant_revenue_estimator --cov-report=term-missing

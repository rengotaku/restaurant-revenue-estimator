<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}店舗収益評価{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <a href="/" class="text-lg font-bold text-gray-800">店舗収益評価</a>
                <div class="flex items-center gap-2 text-sm">
                    <label class="text-gray-500" for="store-select">店舗</label>
                    <select id="store-select" class="border rounded px-2 py-1"
                            onchange="if(this.value){location.href='/stores/'+this.value}">
                        <option value="">選択</option>
                        {% for store in stores %}
                        <option value="{{ store.store_id }}" {% if store.store_id == store_id %}selected{% endif %}>{{ store.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            {% if store_id %}
            <nav class="flex flex-wrap gap-x-4 gap-y-1 mt-3 text-sm">
                <a class="{% if request.url.path == '/stores/' ~ store_id %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}">サマリー</a>
                <a class="{% if '/revenue' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/revenue">売上</a>
                <a class="{% if '/layout' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/layout">座席・卓</a>
                <a class="{% if '/simulator' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/simulator">シミュレーター</a>
                <a class="{% if '/costs' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/costs">人件費・費用</a>
                <a class="{% if '/calendar' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/calendar">年カレンダー</a>
                <a class="{% if '/evidence' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/evidence">根拠・監査</a>
                <a class="{% if '/priorities' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/stores/{{ store_id }}/priorities">改善優先順位</a>
                <a class="{% if '/compare' in request.url.path %}font-bold text-blue-700{% else %}text-gray-600 hover:text-gray-900{% endif %}" href="/compare">比較</a>
            </nav>
            {% endif %}
        </div>
    </header>

    {% if banner %}
    <div class="bg-blue-600 text-white font-medium text-sm py-2 px-4 shadow-sm">
        <div class="max-w-6xl mx-auto">
            {{ banner }}
        </div>
    </div>
    {% endif %}

    <div class="bg-amber-50 border-b border-amber-200">
        <p class="max-w-6xl mx-auto px-4 py-2 text-xs text-amber-900">
            これはシナリオであって実績でも予測でもない。実績データで誤差を測るまでは、出力を予測として扱わない。
        </p>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t mt-16 py-4 text-center text-gray-400 text-sm">
        restaurant-revenue-estimator
    </footer>

    <script src="/static/js/chart.js" defer></script>
    <script src="/static/js/alpine.js" defer></script>
</body>
</html>

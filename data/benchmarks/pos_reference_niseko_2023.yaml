definition_note: >-
  ニセコ東急グラン・ヒラフのレストラン 1 店舗のモバイルオーダー分。
  2022-12-20〜2023-02-28 の 71 日、実売上のみ（キャンセル・仮売上・現金支払は除く）。
  ランチのみ（9〜15 時）。金額が税込か税抜かはデータに明記が無い。
  ライセンスは CC BY。このシステムの入力には使わず、仮定のレンジを置くときの参考値として持つ。

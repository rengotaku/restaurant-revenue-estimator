lunch_stay_ratio_by_group_size:
  unit: ratio
  status: ASSUMPTION
  justification: Bell & Pliner (2003) Appetite 41:215-218 の中価格帯レストランの昼の観察（1 人 27.6 分・2 人 44.9 分・3 人 47.2 分・4 人 52.3 分）の比。組の人数の分布で重み付けした平均が lunch_stay_minutes になるように割り戻して使う。米国の 2 店・各 2 日の観察で、この店の昼に当てはまるかは未確認
  range:
    low: {1: 1, 2: 1, 3: 1, 4: 1}
    base: {1: 27.6, 2: 44.9, 3: 47.2, 4: 52.3}
    high: {1: 27.6, 2: 44.9, 3: 47.2, 4: 52.3}
  how_to_verify: 着席から退店までの時間を、組の人数ごとに 10 組ずつ測る
  value: {1: 1, 2: 1, 3: 1, 4: 1}
